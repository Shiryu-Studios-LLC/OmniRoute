name: Cloudflare Worker check

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-build:
    name: Validate isolated Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check Worker runtime boundary and dry-run bundle
        run: npm run cloudflare:build

      - name: Check Cloudflare migration numbering
        run: npm run check:migration-numbering
