name: Deploy Cloudflare staging

on:
  workflow_dispatch:
    inputs:
      confirm_staging:
        description: Type deploy-staging to deploy the isolated staging Worker
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Validate and deploy staging Worker
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_STAGING_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_STAGING_D1_DATABASE_ID }}
      CLOUDFLARE_STAGING_OIDC_EGRESS_SERVICE_ID: ${{ vars.CLOUDFLARE_STAGING_OIDC_EGRESS_SERVICE_ID }}
      OMNIROUTE_CLOUD_PUBLIC_ORIGIN: ${{ vars.OMNIROUTE_CLOUD_PUBLIC_ORIGIN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate staging-only credentials and migration inputs
        shell: bash
        env:
          CONFIRM_STAGING: ${{ inputs.confirm_staging }}
          OMNIROUTE_CLOUD_IDENTITY_ADMIN_TOKEN: ${{ secrets.OMNIROUTE_CLOUD_IDENTITY_ADMIN_TOKEN }}
          OMNIROUTE_CLOUD_INFERENCE_ADMIN_TOKEN: ${{ secrets.OMNIROUTE_CLOUD_INFERENCE_ADMIN_TOKEN }}
          OMNIROUTE_CLOUD_LIFECYCLE_ADMIN_TOKEN: ${{ secrets.OMNIROUTE_CLOUD_LIFECYCLE_ADMIN_TOKEN }}
          OMNIROUTE_CLOUD_TENANT_HOSTS_ADMIN_TOKEN: ${{ secrets.OMNIROUTE_CLOUD_TENANT_HOSTS_ADMIN_TOKEN }}
          OMNIROUTE_CLOUD_FRONT_DESK_ADMIN_TOKEN: ${{ secrets.OMNIROUTE_CLOUD_FRONT_DESK_ADMIN_TOKEN }}
          OMNIROUTE_CLOUD_MAINTENANCE_TOKEN: ${{ secrets.OMNIROUTE_CLOUD_MAINTENANCE_TOKEN }}
          OMNIROUTE_CLOUD_CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.OMNIROUTE_CLOUD_CREDENTIAL_ENCRYPTION_KEY }}
          OMNIROUTE_CLOUD_IDEMPOTENCY_HMAC_KEY: ${{ secrets.OMNIROUTE_CLOUD_IDEMPOTENCY_HMAC_KEY }}
          OMNIROUTE_CLOUD_OIDC_EGRESS_TOKEN: ${{ secrets.OMNIROUTE_CLOUD_OIDC_EGRESS_TOKEN }}
          CLOUDFLARE_STAGING_OIDC_EGRESS_SERVICE_ID: ${{ vars.CLOUDFLARE_STAGING_OIDC_EGRESS_SERVICE_ID }}
          OMNIROUTE_CLOUD_PUBLIC_ORIGIN: ${{ vars.OMNIROUTE_CLOUD_PUBLIC_ORIGIN }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRM_STAGING" != "deploy-staging" ]]; then
            echo "Type deploy-staging in the workflow input to continue."
            exit 1
          fi
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo "Missing CLOUDFLARE_API_TOKEN in cloudflare-staging environment."; exit 1; }
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[[:xdigit:]]{32}$ ]] || { echo "CLOUDFLARE_ACCOUNT_ID must be a 32-character Cloudflare account ID."; exit 1; }
          [[ "$CLOUDFLARE_STAGING_D1_DATABASE_ID" =~ ^[[:xdigit:]]{32}$ ]] || { echo "CLOUDFLARE_STAGING_D1_DATABASE_ID must be a 32-character staging D1 ID."; exit 1; }
          operator_token_names=(OMNIROUTE_CLOUD_IDENTITY_ADMIN_TOKEN OMNIROUTE_CLOUD_INFERENCE_ADMIN_TOKEN OMNIROUTE_CLOUD_LIFECYCLE_ADMIN_TOKEN OMNIROUTE_CLOUD_TENANT_HOSTS_ADMIN_TOKEN OMNIROUTE_CLOUD_FRONT_DESK_ADMIN_TOKEN OMNIROUTE_CLOUD_MAINTENANCE_TOKEN)
          declare -A operator_token_values=()
          for token_name in "${operator_token_names[@]}"; do
            token_value="${!token_name:-}"
            [[ "$token_value" =~ ^[A-Za-z0-9._~+/=-]{32,512}$ ]] || { echo "$token_name must be 32–512 URL-safe characters with no whitespace or control characters."; exit 1; }
            [[ -z "${operator_token_values[$token_value]+present}" ]] || { echo "Operator scope tokens must all be distinct."; exit 1; }
            operator_token_values["$token_value"]="$token_name"
          done
          [[ "$OMNIROUTE_CLOUD_CREDENTIAL_ENCRYPTION_KEY" =~ ^[A-Za-z0-9+/]{43}=$ ]] || { echo "OMNIROUTE_CLOUD_CREDENTIAL_ENCRYPTION_KEY must be a base64-encoded 32-byte key."; exit 1; }
          [[ "$OMNIROUTE_CLOUD_IDEMPOTENCY_HMAC_KEY" =~ ^[A-Za-z0-9+/]{43}=$ ]] || { echo "OMNIROUTE_CLOUD_IDEMPOTENCY_HMAC_KEY must be a base64-encoded 32-byte key."; exit 1; }
          for secret_name in OMNIROUTE_CLOUD_CREDENTIAL_ENCRYPTION_KEY OMNIROUTE_CLOUD_IDEMPOTENCY_HMAC_KEY; do
            secret_value="${!secret_name}"
            [[ -z "${operator_token_values[$secret_value]+present}" ]] || { echo "$secret_name must be distinct from every operator token."; exit 1; }
            operator_token_values["$secret_value"]="$secret_name"
          done
          if [[ -n "$CLOUDFLARE_STAGING_OIDC_EGRESS_SERVICE_ID" ]]; then
            [[ "$CLOUDFLARE_STAGING_OIDC_EGRESS_SERVICE_ID" =~ ^[[:xdigit:]]{8}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{12}$ ]] || { echo "CLOUDFLARE_STAGING_OIDC_EGRESS_SERVICE_ID must be a VPC Service UUID."; exit 1; }
            [[ "$OMNIROUTE_CLOUD_OIDC_EGRESS_TOKEN" =~ ^[A-Za-z0-9_-]{32,512}$ ]] || { echo "OMNIROUTE_CLOUD_OIDC_EGRESS_TOKEN must be configured with the dedicated staging VPC Service."; exit 1; }
            [[ -z "${operator_token_values[$OMNIROUTE_CLOUD_OIDC_EGRESS_TOKEN]+present}" ]] || { echo "The OIDC egress token must be distinct from every operator and runtime secret."; exit 1; }
            operator_token_values["$OMNIROUTE_CLOUD_OIDC_EGRESS_TOKEN"]="OMNIROUTE_CLOUD_OIDC_EGRESS_TOKEN"
          elif [[ -n "$OMNIROUTE_CLOUD_OIDC_EGRESS_TOKEN" ]]; then
            echo "OMNIROUTE_CLOUD_OIDC_EGRESS_TOKEN requires CLOUDFLARE_STAGING_OIDC_EGRESS_SERVICE_ID; egress stays disabled without the dedicated binding."
            exit 1
          fi
          [[ "$OMNIROUTE_CLOUD_PUBLIC_ORIGIN" =~ ^https://omniroute-cloud-runtime-staging\.[A-Za-z0-9-]+\.workers\.dev$ ]] || { echo "OMNIROUTE_CLOUD_PUBLIC_ORIGIN must be the exact HTTPS origin for the isolated staging workers.dev host."; exit 1; }
          if [[ ! -d cloudflare/migrations ]] || ! find cloudflare/migrations -maxdepth 1 -type f -name '*.sql' -print -quit | grep -q .; then
            echo "No Cloudflare D1 SQL migrations found."
            exit 1
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Validate Worker graph and migration numbering
        run: |
          npm run cloudflare:build
          npm run check:migration-numbering

      - name: Prepare isolated staging config
        id: staging-config
        shell: bash
        env:
          CLOUDFLARE_STAGING_OIDC_EGRESS_SERVICE_ID: ${{ vars.CLOUDFLARE_STAGING_OIDC_EGRESS_SERVICE_ID }}
          OMNIROUTE_CLOUD_OIDC_EGRESS_TOKEN: ${{ secrets.OMNIROUTE_CLOUD_OIDC_EGRESS_TOKEN }}
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/wrangler-cloudflare-staging-${GITHUB_RUN_ID}.json"
          CONFIG_PATH="$config" node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const sourcePath = path.resolve("wrangler.jsonc");
          const source = fs.readFileSync(sourcePath, "utf8");
          // The checked-in Wrangler file is JSONC without comments. Strip JSONC
          // trailing commas before parsing so edits remain schema checked below.
          const config = JSON.parse(source.replace(/,\s*([}\]])/g, "$1"));
          const allowedTopLevel = new Set([
            "$schema",
            "name",
            "main",
            "compatibility_date",
            "compatibility_flags",
            "observability",
            "vars",
            "d1_databases",
            "r2_buckets",
            "durable_objects",
            "vpc_services",
            "migrations",
          ]);
          const unexpectedTopLevel = Object.keys(config).filter((key) => !allowedTopLevel.has(key));
          if (unexpectedTopLevel.length) {
            throw new Error(`Refusing staging config with unexpected Wrangler fields: ${unexpectedTopLevel.join(", ")}`);
          }
          if (!Array.isArray(config.d1_databases) || config.d1_databases.length !== 1) {
            throw new Error("Expected exactly one D1 binding in wrangler.jsonc");
          }
          if (!Array.isArray(config.r2_buckets) || config.r2_buckets.length !== 1) {
            throw new Error("Expected exactly one private R2 image-artifact binding in wrangler.jsonc");
          }
          const artifactBucket = config.r2_buckets[0];
          const allowedR2Fields = new Set(["binding", "bucket_name", "preview_bucket_name"]);
          if (
            Object.keys(artifactBucket).some((key) => !allowedR2Fields.has(key)) ||
            artifactBucket.binding !== "GATEWAY_ARTIFACTS" ||
            artifactBucket.bucket_name !== "omniroute-cloud-gateway-artifacts" ||
            artifactBucket.preview_bucket_name !== "omniroute-cloud-gateway-artifacts-preview"
          ) {
            throw new Error("Refusing staging config with an unexpected R2 binding");
          }
          const db = config.d1_databases[0];
          const allowedDatabaseFields = new Set(["binding", "database_name", "database_id", "migrations_dir"]);
          if (Object.keys(db).some((key) => !allowedDatabaseFields.has(key)) || db.binding !== "DB") {
            throw new Error("Refusing staging config with an unexpected D1 binding");
          }
          const gatewayBindings = config.durable_objects?.bindings;
          if (
            !Array.isArray(gatewayBindings) ||
            gatewayBindings.length !== 1 ||
            gatewayBindings[0].name !== "GATEWAY_SESSIONS" ||
            gatewayBindings[0].class_name !== "GatewaySessionObject" ||
            Object.keys(gatewayBindings[0]).some((key) => !["name", "class_name"].includes(key))
          ) {
            throw new Error("Refusing staging config with an unexpected Durable Object binding");
          }
          if (config.routes?.length || config.route || config.custom_domains?.length) {
            throw new Error("Refusing staging deployment: base config declares route/custom-domain targets");
          }
          if (config.vpc_services?.length) {
            throw new Error("Refusing staging config with an unexpected base VPC Service binding");
          }

          const oidcServiceId = process.env.CLOUDFLARE_STAGING_OIDC_EGRESS_SERVICE_ID ?? "";
          const oidcToken = process.env.OMNIROUTE_CLOUD_OIDC_EGRESS_TOKEN ?? "";
          if (Boolean(oidcServiceId) !== Boolean(oidcToken)) {
            throw new Error("OIDC egress requires both the dedicated staging VPC Service ID and token");
          }
          if (oidcServiceId && !/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(oidcServiceId)) {
            throw new Error("Refusing staging config with an invalid OIDC VPC Service ID");
          }

          config.name = "omniroute-cloud-runtime-staging";
          config.workers_dev = true;
          config.routes = [];
          config.main = path.resolve(config.main);
          config.d1_databases[0].database_name = "omniroute-cloud-runtime-staging";
          config.d1_databases[0].database_id = process.env.CLOUDFLARE_STAGING_D1_DATABASE_ID;
          config.r2_buckets[0].bucket_name = "omniroute-cloud-runtime-staging-artifacts";
          config.r2_buckets[0].preview_bucket_name = "omniroute-cloud-runtime-staging-artifacts-preview";
          config.durable_objects = config.durable_objects ?? { bindings: [] };
          config.vars = {
            ...config.vars,
            OMNIROUTE_ENV: "staging",
            OMNIROUTE_BUILD_SHA: process.env.GITHUB_SHA,
            OMNIROUTE_CLOUD_PUBLIC_ORIGIN: process.env.OMNIROUTE_CLOUD_PUBLIC_ORIGIN,
            OMNIROUTE_CLOUD_OIDC_EGRESS_ENABLED: oidcServiceId ? "true" : "false",
          };
          if (oidcServiceId) {
            config.vpc_services = [{ binding: "OIDC_EGRESS", service_id: oidcServiceId }];
          }
          config.d1_databases[0].migrations_dir = path.resolve("cloudflare/migrations");

          fs.writeFileSync(process.env.CONFIG_PATH, `${JSON.stringify(config, null, 2)}\n`, { mode: 0o600 });
          NODE
          echo "path=$config" >> "$GITHUB_OUTPUT"

      - name: Apply outstanding migrations to the staging D1 database
        shell: bash
        env:
          WRANGLER_CONFIG: ${{ steps.staging-config.outputs.path }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const expectedName = "omniroute-cloud-runtime-staging";
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const databaseId = process.env.CLOUDFLARE_STAGING_D1_DATABASE_ID;

          async function main() {
            let response;
            try {
              response = await fetch(
                `https://api.cloudflare.com/client/v4/accounts/${accountId}/d1/database/${databaseId}`,
                {
                  headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` },
                  signal: AbortSignal.timeout(30_000),
                },
              );
            } catch {
              throw new Error("Could not verify the configured D1 database with Cloudflare.");
            }
            if (!response.ok) {
              throw new Error(`Cloudflare D1 metadata check failed (HTTP ${response.status}).`);
            }
            let payload;
            try {
              payload = await response.json();
            } catch {
              throw new Error("Cloudflare returned invalid D1 metadata.");
            }
            if (payload?.success !== true || payload?.result?.name !== expectedName) {
              throw new Error("Configured D1 ID is not the dedicated staging database; refusing migrations.");
            }
          }

          main().catch((error) => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE
          npx wrangler d1 migrations list omniroute-cloud-runtime-staging --remote --config "$WRANGLER_CONFIG"
          npx wrangler d1 migrations apply omniroute-cloud-runtime-staging --remote --config "$WRANGLER_CONFIG"

      - name: Deploy staging Worker without routes or production bindings
        id: deploy
        shell: bash
        env:
          WRANGLER_CONFIG: ${{ steps.staging-config.outputs.path }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/wrangler-staging-deploy-${GITHUB_RUN_ID}.log"
          npx wrangler deploy --config "$WRANGLER_CONFIG" 2>&1 | tee "$output"
          url="$(grep -Eo 'https://[[:alnum:].-]+\.workers\.dev' "$output" | tail -n 1 || true)"
          [[ "$url" == https://omniroute-cloud-runtime-staging.*.workers.dev ]] || {
            echo "Could not verify the deployed staging workers.dev URL from Wrangler output."
            exit 1
          }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Bind staging identity admin token
        shell: bash
        env:
          WRANGLER_CONFIG: ${{ steps.staging-config.outputs.path }}
          OMNIROUTE_CLOUD_IDENTITY_ADMIN_TOKEN: ${{ secrets.OMNIROUTE_CLOUD_IDENTITY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$OMNIROUTE_CLOUD_IDENTITY_ADMIN_TOKEN" | npx wrangler secret put OMNIROUTE_CLOUD_IDENTITY_ADMIN_TOKEN --config "$WRANGLER_CONFIG"

      - name: Bind staging inference admin token
        shell: bash
        env:
          WRANGLER_CONFIG: ${{ steps.staging-config.outputs.path }}
          OMNIROUTE_CLOUD_INFERENCE_ADMIN_TOKEN: ${{ secrets.OMNIROUTE_CLOUD_INFERENCE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$OMNIROUTE_CLOUD_INFERENCE_ADMIN_TOKEN" | npx wrangler secret put OMNIROUTE_CLOUD_INFERENCE_ADMIN_TOKEN --config "$WRANGLER_CONFIG"

      - name: Bind staging lifecycle admin token
        shell: bash
        env:
          WRANGLER_CONFIG: ${{ steps.staging-config.outputs.path }}
          OMNIROUTE_CLOUD_LIFECYCLE_ADMIN_TOKEN: ${{ secrets.OMNIROUTE_CLOUD_LIFECYCLE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$OMNIROUTE_CLOUD_LIFECYCLE_ADMIN_TOKEN" | npx wrangler secret put OMNIROUTE_CLOUD_LIFECYCLE_ADMIN_TOKEN --config "$WRANGLER_CONFIG"

      - name: Bind staging tenant-hosts admin token
        shell: bash
        env:
          WRANGLER_CONFIG: ${{ steps.staging-config.outputs.path }}
          OMNIROUTE_CLOUD_TENANT_HOSTS_ADMIN_TOKEN: ${{ secrets.OMNIROUTE_CLOUD_TENANT_HOSTS_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$OMNIROUTE_CLOUD_TENANT_HOSTS_ADMIN_TOKEN" | npx wrangler secret put OMNIROUTE_CLOUD_TENANT_HOSTS_ADMIN_TOKEN --config "$WRANGLER_CONFIG"

      - name: Bind staging Front Desk admin token
        shell: bash
        env:
          WRANGLER_CONFIG: ${{ steps.staging-config.outputs.path }}
          OMNIROUTE_CLOUD_FRONT_DESK_ADMIN_TOKEN: ${{ secrets.OMNIROUTE_CLOUD_FRONT_DESK_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$OMNIROUTE_CLOUD_FRONT_DESK_ADMIN_TOKEN" | npx wrangler secret put OMNIROUTE_CLOUD_FRONT_DESK_ADMIN_TOKEN --config "$WRANGLER_CONFIG"

      - name: Bind staging cloud maintenance token
        shell: bash
        env:
          WRANGLER_CONFIG: ${{ steps.staging-config.outputs.path }}
          OMNIROUTE_CLOUD_MAINTENANCE_TOKEN: ${{ secrets.OMNIROUTE_CLOUD_MAINTENANCE_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$OMNIROUTE_CLOUD_MAINTENANCE_TOKEN" | npx wrangler secret put OMNIROUTE_CLOUD_MAINTENANCE_TOKEN --config "$WRANGLER_CONFIG"

      - name: Bind staging cloud credential encryption key
        shell: bash
        env:
          WRANGLER_CONFIG: ${{ steps.staging-config.outputs.path }}
          OMNIROUTE_CLOUD_CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.OMNIROUTE_CLOUD_CREDENTIAL_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$OMNIROUTE_CLOUD_CREDENTIAL_ENCRYPTION_KEY" | npx wrangler secret put OMNIROUTE_CLOUD_CREDENTIAL_ENCRYPTION_KEY --config "$WRANGLER_CONFIG"

      - name: Bind staging cloud idempotency HMAC key
        shell: bash
        env:
          WRANGLER_CONFIG: ${{ steps.staging-config.outputs.path }}
          OMNIROUTE_CLOUD_IDEMPOTENCY_HMAC_KEY: ${{ secrets.OMNIROUTE_CLOUD_IDEMPOTENCY_HMAC_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$OMNIROUTE_CLOUD_IDEMPOTENCY_HMAC_KEY" | npx wrangler secret put OMNIROUTE_CLOUD_IDEMPOTENCY_HMAC_KEY --config "$WRANGLER_CONFIG"

      - name: Bind staging OIDC egress token
        if: ${{ vars.CLOUDFLARE_STAGING_OIDC_EGRESS_SERVICE_ID != '' }}
        shell: bash
        env:
          WRANGLER_CONFIG: ${{ steps.staging-config.outputs.path }}
          OMNIROUTE_CLOUD_OIDC_EGRESS_TOKEN: ${{ secrets.OMNIROUTE_CLOUD_OIDC_EGRESS_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$OMNIROUTE_CLOUD_OIDC_EGRESS_TOKEN" | npx wrangler secret put OMNIROUTE_CLOUD_OIDC_EGRESS_TOKEN --config "$WRANGLER_CONFIG"

      - name: Verify staging health and D1 binding
        shell: bash
        env:
          STAGING_URL: ${{ steps.deploy.outputs.url }}
          OIDC_EGRESS_EXPECTED: ${{ vars.CLOUDFLARE_STAGING_OIDC_EGRESS_SERVICE_ID != '' && 'enabled' || 'disabled' }}
          EXPECTED_BUILD_SHA: ${{ github.sha }}
          OMNIROUTE_CLOUD_IDENTITY_ADMIN_TOKEN: ${{ secrets.OMNIROUTE_CLOUD_IDENTITY_ADMIN_TOKEN }}
          OMNIROUTE_CLOUD_INFERENCE_ADMIN_TOKEN: ${{ secrets.OMNIROUTE_CLOUD_INFERENCE_ADMIN_TOKEN }}
          OMNIROUTE_CLOUD_LIFECYCLE_ADMIN_TOKEN: ${{ secrets.OMNIROUTE_CLOUD_LIFECYCLE_ADMIN_TOKEN }}
          OMNIROUTE_CLOUD_TENANT_HOSTS_ADMIN_TOKEN: ${{ secrets.OMNIROUTE_CLOUD_TENANT_HOSTS_ADMIN_TOKEN }}
          OMNIROUTE_CLOUD_FRONT_DESK_ADMIN_TOKEN: ${{ secrets.OMNIROUTE_CLOUD_FRONT_DESK_ADMIN_TOKEN }}
          OMNIROUTE_CLOUD_MAINTENANCE_TOKEN: ${{ secrets.OMNIROUTE_CLOUD_MAINTENANCE_TOKEN }}
        run: |
          set -euo pipefail
          denied="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$STAGING_URL/__cloud/v1/tenants/__smoke_missing__/status")"
          [[ "$denied" == "401" ]] || {
            echo "Staging Worker did not reject an unauthenticated admin request."
            exit 1
          }
          lifecycle_authorized="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --header "Authorization: Bearer $OMNIROUTE_CLOUD_LIFECYCLE_ADMIN_TOKEN" "$STAGING_URL/__cloud/v1/tenants/__smoke_missing__/status")"
          [[ "$lifecycle_authorized" == "404" ]] || {
            echo "Staging Worker lifecycle authorization smoke check returned an unexpected status."
            exit 1
          }
          identity_authorized="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --header "Authorization: Bearer $OMNIROUTE_CLOUD_IDENTITY_ADMIN_TOKEN" "$STAGING_URL/__cloud/v1/tenants/__smoke_missing__/oidc")"
          [[ "$identity_authorized" == "404" ]] || { echo "Identity admin authorization smoke check returned HTTP $identity_authorized instead of 404."; exit 1; }
          inference_authorized="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --header "Authorization: Bearer $OMNIROUTE_CLOUD_INFERENCE_ADMIN_TOKEN" "$STAGING_URL/__cloud/v1/tenants/__smoke_missing__/inference-budget")"
          [[ "$inference_authorized" == "404" ]] || { echo "Inference admin authorization smoke check returned HTTP $inference_authorized instead of 404."; exit 1; }
          hosts_authorized="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --header "Authorization: Bearer $OMNIROUTE_CLOUD_TENANT_HOSTS_ADMIN_TOKEN" "$STAGING_URL/__cloud/v1/tenant-hosts?tenantId=__smoke_missing__")"
          [[ "$hosts_authorized" == "200" ]] || { echo "Tenant-hosts admin authorization smoke check returned HTTP $hosts_authorized instead of 200."; exit 1; }
          front_desk_authorized="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --header "Authorization: Bearer $OMNIROUTE_CLOUD_FRONT_DESK_ADMIN_TOKEN" "$STAGING_URL/__cloud/v1/front-desk/configs?tenantId=__smoke_missing__")"
          [[ "$front_desk_authorized" == "200" ]] || { echo "Front Desk admin authorization smoke check returned HTTP $front_desk_authorized instead of 200."; exit 1; }
          maintenance_authorized="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --header "Authorization: Bearer $OMNIROUTE_CLOUD_MAINTENANCE_TOKEN" "$STAGING_URL/__cloud/v1/tenants/__smoke_missing__/status")"
          [[ "$maintenance_authorized" == "404" ]] || {
            echo "Staging Worker maintenance authorization smoke check returned an unexpected status."
            exit 1
          }
          maintenance_out_of_scope="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --header "Authorization: Bearer $OMNIROUTE_CLOUD_MAINTENANCE_TOKEN" "$STAGING_URL/__cloud/v1/tenants/__smoke_missing__/provider-connections")"
          [[ "$maintenance_out_of_scope" == "401" ]] || {
            echo "Staging Worker maintenance token escaped its tenant lifecycle scope."
            exit 1
          }
          identity_out_of_scope="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --header "Authorization: Bearer $OMNIROUTE_CLOUD_IDENTITY_ADMIN_TOKEN" "$STAGING_URL/__cloud/v1/tenants/__smoke_missing__/inference-budget")"
          [[ "$identity_out_of_scope" == "401" ]] || { echo "Identity admin crossed into inference policy scope."; exit 1; }
          inference_out_of_scope="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --header "Authorization: Bearer $OMNIROUTE_CLOUD_INFERENCE_ADMIN_TOKEN" "$STAGING_URL/__cloud/v1/tenants/__smoke_missing__/oidc")"
          [[ "$inference_out_of_scope" == "401" ]] || { echo "Inference admin crossed into identity scope."; exit 1; }
          hosts_out_of_scope="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --header "Authorization: Bearer $OMNIROUTE_CLOUD_TENANT_HOSTS_ADMIN_TOKEN" "$STAGING_URL/__cloud/v1/front-desk/configs?tenantId=__smoke_missing__")"
          [[ "$hosts_out_of_scope" == "401" ]] || { echo "Tenant-hosts admin crossed into Front Desk config scope."; exit 1; }
          front_desk_out_of_scope="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --header "Authorization: Bearer $OMNIROUTE_CLOUD_FRONT_DESK_ADMIN_TOKEN" "$STAGING_URL/__cloud/v1/tenant-hosts?tenantId=__smoke_missing__")"
          [[ "$front_desk_out_of_scope" == "401" ]] || { echo "Front Desk admin crossed into tenant-hosts scope."; exit 1; }
          health="$(curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-connrefused "$STAGING_URL/__cloud/health")"
          printf '%s' "$health" | node -e '
            let body = "";
            process.stdin.on("data", (chunk) => { body += chunk; });
            process.stdin.on("end", () => {
              const value = JSON.parse(body);
              if (value.status !== "ok" || value.runtime !== "cloudflare") process.exit(1);
            });
          '
          db="$(curl --fail --silent --show-error "$STAGING_URL/__cloud/db")"
          printf '%s' "$db" | node -e '
            let body = "";
            process.stdin.on("data", (chunk) => { body += chunk; });
            process.stdin.on("end", () => {
              const value = JSON.parse(body);
              if (value.status !== "ok" || value.runtime !== "cloudflare" || value.database !== "d1") process.exit(1);
            });
          '
          readiness="$(curl --fail --silent --show-error "$STAGING_URL/__cloud/readiness")"
          printf '%s' "$readiness" | node -e '
            let body = "";
            process.stdin.on("data", (chunk) => { body += chunk; });
            process.stdin.on("end", () => {
              const value = JSON.parse(body);
              if (
                value.status !== "ready" ||
                value.runtime !== "cloudflare" ||
                value.checks?.database !== "ok" ||
                value.checks?.gateway !== "ok" ||
                value.checks?.artifacts !== "ok" ||
                value.checks?.oidcEgress !== (process.env.OIDC_EGRESS_EXPECTED === "enabled" ? "ok" : "disabled")
              ) process.exit(1);
            });
          '
          runtime="$(curl --fail --silent --show-error "$STAGING_URL/__cloud/runtime")"
          printf '%s' "$runtime" | EXPECTED_BUILD_SHA="$EXPECTED_BUILD_SHA" node -e '
            let body = "";
            process.stdin.on("data", (chunk) => { body += chunk; });
            process.stdin.on("end", () => {
              const value = JSON.parse(body);
              if (
                value.runtime !== "cloudflare" ||
                value.environment !== "staging" ||
                value.buildSha !== process.env.EXPECTED_BUILD_SHA
              ) process.exit(1);
            });
          '
          echo "Staging Worker health, D1, Durable Object, environment, and build SHA are healthy."

      - name: Remove temporary Wrangler configuration and deployment log
        if: always()
        shell: bash
        env:
          WRANGLER_CONFIG: ${{ steps.staging-config.outputs.path }}
        run: |
          rm -f -- "${WRANGLER_CONFIG:-}" "$RUNNER_TEMP/wrangler-staging-deploy-${GITHUB_RUN_ID}.log"
